name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_os: linux
            asset_arch: amd64
            use_zigbuild: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            asset_os: linux
            asset_arch: arm64
            use_zigbuild: true
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
            use_zigbuild: false
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
            use_zigbuild: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@v2
        if: matrix.use_zigbuild
      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build release asset
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          if [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            WTK_VERSION="$version" cargo zigbuild --release --bin wtk --target "${{ matrix.target }}"
          else
            WTK_VERSION="$version" cargo build --release --bin wtk --target "${{ matrix.target }}"
          fi
          work="dist/wtk_${version}_${{ matrix.asset_os }}_${{ matrix.asset_arch }}"
          mkdir -p "$work"
          cp "target/${{ matrix.target }}/release/wtk" "$work/wtk"
          tar -C "$work" -czf "dist/wtk_${version}_${{ matrix.asset_os }}_${{ matrix.asset_arch }}.tar.gz" wtk
      - uses: actions/upload-artifact@v4
        with:
          name: wtk-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Prepare release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find dist-artifacts -name '*.tar.gz' -exec cp {} dist/ \;
          cd dist
          sha256sum wtk_*.tar.gz > checksums.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
          fi

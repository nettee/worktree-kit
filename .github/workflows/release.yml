name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Build release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for os in darwin linux; do
            for arch in amd64 arm64; do
              work="dist/wtk_${version}_${os}_${arch}"
              mkdir -p "$work"
              GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X github.com/nettee/worktree-kit/internal/cli.Version=${version}" -o "$work/wtk" ./cmd/wtk
              tar -C "$work" -czf "dist/wtk_${version}_${os}_${arch}.tar.gz" wtk
            done
          done
          cd dist
          sha256sum wtk_${version}_*.tar.gz > checksums.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
          fi
